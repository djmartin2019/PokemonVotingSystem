# Serve cached sprites straight from disk; build missing ones with sprite.php
<Directory /var/www/html/public>
    RewriteEngine On
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteRule ^sprites/(small|large)/([0-9]+)\.webp$ sprite.php?size=$1&id=$2 [L]
</Directory>

# CSS/JS are versioned with ?v=, fonts and sprites never change: cache for a year
<LocationMatch "^/(assets|sprites)/">
    Header set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>
