; Cache compiled PHP in memory instead of recompiling every file on every request
opcache.enable=1
opcache.memory_consumption=64
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=4000
; Code only changes when the image is rebuilt, so skip checking file timestamps
opcache.validate_timestamps=0

realpath_cache_size=4096K
realpath_cache_ttl=600

expose_php=Off
